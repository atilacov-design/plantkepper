<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PlantKeeper</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0F0C;--g:#65C466;--gd:#19351F;--w:#F5F7F5;--m:#8B938C;--card:#121A14;--line:#1f2a22;
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--w);font:400 16px/1.5 "DM Sans",system-ui,sans-serif}
main{max-width:880px;margin:0 auto;padding:20px 18px 96px}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;margin:0;letter-spacing:-.01em}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:11px 18px;background:var(--g);color:#0B0F0C;font-weight:600}
button.ghost{background:var(--gd);color:var(--w)}
button.danger{background:transparent;color:#e07a6e;padding:11px 8px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.card:focus-visible{outline:2px solid var(--g);outline-offset:2px}
header.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}
.brand{font-size:1.5rem}.brand span{color:var(--g)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:24px}
.stat{background:var(--gd);border-radius:20px;padding:16px}
.stat b{display:block;font:600 1.8rem Fraunces,Georgia,serif}
.stat small{color:var(--m)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;overflow:hidden;cursor:pointer;text-align:left;padding:0;color:inherit;font-weight:400}
.ph{aspect-ratio:4/3;background:var(--gd) center/cover;display:grid;place-items:center;font-size:3rem}
.card .in{padding:14px 16px 16px}
.card h3{font-size:1.2rem}.sub{color:var(--m);font-size:.9rem}
.chip{display:inline-block;background:var(--gd);color:var(--g);border-radius:99px;padding:2px 10px;font-size:.8rem;margin-top:8px}
.empty{text-align:center;padding:56px 12px;color:var(--m)}
.empty h2{color:var(--w);margin-bottom:8px}
.hero{aspect-ratio:16/10;border-radius:28px;background:var(--gd) center/cover;display:grid;place-items:center;font-size:4rem;margin:14px 0 18px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:16px 0 26px}
.fact{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px}
.fact small{color:var(--m);display:block}
.note{border-left:3px solid var(--g);padding:4px 0 4px 14px;margin:14px 0}
.note small{color:var(--m)}
.note p{margin:2px 0 0;white-space:pre-wrap}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
form.add{display:flex;gap:10px;margin:12px 0 4px}
dialog{background:var(--card);color:var(--w);border:1px solid var(--line);border-radius:24px;padding:22px;width:min(480px,calc(100% - 28px));max-height:calc(100% - 28px);overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.7)}
label{display:block;margin:12px 0 4px;color:var(--m);font-size:.9rem}
input,select,textarea{width:100%;background:var(--bg);color:var(--w);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font:inherit}
textarea{min-height:76px;resize:vertical}
.sr{position:absolute;opacity:0;width:1px;height:1px;padding:0;border:0}
.pick{display:flex;align-items:center;gap:14px;border:1.5px dashed var(--g);border-radius:18px;padding:12px;color:var(--w);cursor:pointer;margin:0;font-size:1rem}
.sr:focus-visible+.pick{outline:2px solid var(--g);outline-offset:2px}
.pick{position:relative;overflow:hidden}
.pick:focus-within{outline:2px solid var(--g);outline-offset:2px}
.pick.cam{margin-top:8px;justify-content:center;border-style:solid;border-color:var(--line)}
.cov{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;padding:0;border:0;font-size:0}
.pv{width:72px;height:72px;border-radius:16px;background:var(--gd) center/cover;display:grid;place-items:center;font-size:1.6rem;flex:none}
button:disabled{opacity:.5;cursor:wait}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}.card:hover{border-color:var(--g)}}
</style>
</head>
<body>
<main id="app"></main>
<dialog id="dlg"></dialog>
<script>
const KEY='plantkeeper:v1';
let plants=[],view=null,DB=null,synced={};
try{plants=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){plants=[]}
const lsSave=()=>{try{localStorage.setItem(KEY,JSON.stringify(plants))}catch(e){alert('Não foi possível salvar. A foto pode estar muito grande ou o armazenamento está cheio.')}};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const fmtDate=d=>d?new Date(d+'T12:00:00').toLocaleDateString('pt-BR'):'—';
function span(d){
  if(!d)return '—';
  const days=Math.floor((Date.now()-new Date(d+'T12:00:00'))/864e5);
  if(days<0)return 'ainda não chegou';
  if(days<1)return 'chegou hoje';
  if(days<60)return days+(days===1?' dia':' dias');
  if(days<730)return Math.floor(days/30.4)+' meses';
  return Math.floor(days/365.25)+' anos';
}
const safe=u=>/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/.test(u||'')?u:'';
function thumb(p){return safe(p.photo)?`style="background-image:url('${p.photo}')"`:''}
function render(){
  const app=$('#app');
  const p=plants.find(x=>x.id===view);
  if(!p){view=null;
    const places=new Set(plants.map(x=>x.place).filter(Boolean)).size;
    const notes=plants.reduce((n,x)=>n+x.notes.length,0);
    app.innerHTML=`<header class="top"><h1 class="brand">Plant<span>Keeper</span></h1><div class="row"><button class="ghost" id="exp">Backup</button><button id="add">Nova planta</button></div></header>
    <div class="stats"><div class="stat"><b>${plants.length}</b><small>plantas</small></div><div class="stat"><b>${places}</b><small>ambientes</small></div><div class="stat"><b>${notes}</b><small>anotações</small></div></div>
    ${plants.length?`<div class="grid">${plants.map(x=>`<button class="card" data-id="${x.id}"><div class="ph" ${thumb(x)}>${x.photo?'':'🌱'}</div><div class="in"><h3>${esc(x.name)}</h3><div class="sub">${esc(x.species||'Espécie não informada')}</div><span class="chip">${span(x.date)} em casa</span></div></button>`).join('')}</div>`
    :`<div class="empty"><h2>Sua coleção começa aqui</h2><p>Cadastre a primeira planta com nome, foto e data de chegada.</p><button id="add2">Cadastrar planta</button></div>`}`;
    $('#add')?.addEventListener('click',()=>form());
    $('#add2')?.addEventListener('click',()=>form());
    $('#exp')?.addEventListener('click',backup);
    app.querySelectorAll('.card').forEach(c=>c.onclick=()=>{view=c.dataset.id;render();scrollTo(0,0)});
  }else{
    app.innerHTML=`<header class="top"><button class="ghost" id="back">Voltar</button><div class="row"><button class="ghost" id="edit">Editar</button><button class="danger" id="del">Excluir</button></div></header>
    <h1>${esc(p.name)}</h1><div class="sub">${esc(p.species||'Espécie não informada')}</div>
    <div class="hero" ${thumb(p)}>${p.photo?'':'🌱'}</div>
    <div class="facts"><div class="fact"><small>Tempo em casa</small>${span(p.date)}</div><div class="fact"><small>Chegou em</small>${fmtDate(p.date)}</div><div class="fact"><small>Ambiente</small>${esc(p.place||'—')}</div></div>
    <h2>Diário</h2>
    <form class="add" id="nf"><input id="nt" placeholder="Regou, adubou, nova folha…" required aria-label="Nova anotação"><button>Anotar</button></form>
    ${p.notes.length?p.notes.map((n,i)=>`<div class="note"><small>${fmtDate(n.d)} <button class="danger" data-i="${i}" style="padding:0 6px;font-size:.8rem">remover</button></small><p>${esc(n.t)}</p></div>`).join(''):'<p class="sub">Nenhuma anotação ainda. Registre rega, adubação ou mudanças que você notar.</p>'}`;
    $('#back').onclick=()=>{view=null;render()};
    $('#edit').onclick=()=>form(p);
    $('#del').onclick=()=>{if(confirm('Excluir '+p.name+'? Isso apaga também o diário dela.')){plants=plants.filter(x=>x.id!==p.id);save();view=null;render()}};
    $('#nf').onsubmit=e=>{e.preventDefault();const t=$('#nt').value.trim();if(!t)return;p.notes.unshift({d:today(),t});save();render()};
    app.querySelectorAll('.note button').forEach(b=>b.onclick=()=>{p.notes.splice(+b.dataset.i,1);save();render()});
  }
}
function form(p){
  const d=$('#dlg');let photo=safe(p?.photo);
  d.innerHTML=`<form method="dialog" id="pf"><h2>${p?'Editar planta':'Nova planta'}</h2>
  <label for="n">Nome</label><input id="n" required value="${esc(p?.name)}" placeholder="Ex.: Costela-de-adão da sala">
  <label for="s">Espécie</label><input id="s" value="${esc(p?.species)}" placeholder="Ex.: Monstera deliciosa">
  <label for="dt">Data em que chegou</label><input id="dt" type="date" value="${p?.date||today()}">
  <label for="pl">Ambiente</label><input id="pl" value="${esc(p?.place)}" placeholder="Sala, varanda, quarto…">
  <label>Foto</label><div class="pick"><span class="pv" id="pv"></span><span id="pt"></span><input id="ph" class="cov" type="file" accept="image/*" aria-label="Escolher foto da galeria"></div><div class="pick cam"><span>📷 Tirar foto agora</span><input id="ph2" class="cov" type="file" accept="image/*" capture="environment" aria-label="Tirar foto com a câmera"></div><p class="sub" style="margin:8px 0 0">Não abriu? Envie a foto no chat do Claude e peça para anexar a esta planta.</p><button type="button" class="danger" id="rm" hidden>Remover foto</button>
  <div class="row" style="margin-top:20px;justify-content:flex-end"><button type="button" class="ghost" id="cx">Cancelar</button><button id="sv">Salvar planta</button></div></form>`;
  d.showModal();
  $('#cx').onclick=()=>d.close();
  const sv=$('#sv');
  const show=()=>{const pv=$('#pv');pv.style.backgroundImage=photo?`url('${photo}')`:'';pv.textContent=photo?'':'📷';$('#pt').textContent=photo?'Trocar foto':'Tirar foto ou escolher da galeria';$('#rm').hidden=!photo};
  show();
  $('#rm').onclick=()=>{photo='';$('#ph').value='';$('#ph2').value='';show()};
  const onPick=e=>{
    const f=e.target.files[0];if(!f)return;
    sv.disabled=true;$('#pt').textContent='Processando foto…';
    const fail=m=>{sv.disabled=false;show();alert(m)};
    const r=new FileReader();
    r.onerror=()=>fail('Não foi possível ler a foto.');
    r.onload=()=>{const im=new Image();
      im.onerror=()=>fail('Formato de imagem não suportado. Tente JPG ou PNG.');
      im.onload=()=>{
        const k=Math.min(1,640/Math.max(im.width,im.height)),c=document.createElement('canvas');
        c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        photo=c.toDataURL('image/jpeg',.7);sv.disabled=false;show()};
      im.src=r.result};
    r.readAsDataURL(f);
  };
  $('#ph').onchange=onPick;$('#ph2').onchange=onPick;
  $('#pf').onsubmit=()=>{
    const data={name:$('#n').value.trim(),species:$('#s').value.trim(),date:$('#dt').value,place:$('#pl').value.trim(),photo};
    if(p)Object.assign(plants.find(x=>x.id===p.id)||p,data);else{plants.unshift({id:Date.now().toString(36),ts:Date.now(),notes:[],...data})}
    save();render();
  };
}
function backup(){
  const d=$('#dlg');
  d.innerHTML=`<h2>Backup</h2><p class="sub">Copie este texto e guarde em um lugar seguro. Para restaurar, cole abaixo e toque em Restaurar.</p><textarea id="bk" style="min-height:160px">${esc(JSON.stringify(plants))}</textarea><div class="row" style="margin-top:16px;justify-content:flex-end"><button class="ghost" id="cx">Fechar</button><button id="rs">Restaurar</button></div>`;
  d.showModal();
  $('#cx').onclick=()=>d.close();
  $('#rs').onclick=()=>{try{const a=JSON.parse($('#bk').value);if(!Array.isArray(a))throw 0;if(confirm('Substituir as plantas atuais por este backup?')){plants=a;save();d.close();view=null;render()}}catch(e){alert('Texto de backup inválido.')}};
}
const fail=e=>alert('Não consegui salvar na nuvem: '+(e&&e.message||e));
function save(){
  if(!DB){lsSave();return}
  const ids=new Set(plants.map(p=>p.id));
  plants.forEach(p=>{const j=JSON.stringify(p);if(synced[p.id]===j)return;synced[p.id]=j;const{id,...rest}=p;DB.doc('plants/'+id).set(rest).catch(fail)});
  Object.keys(synced).forEach(id=>{if(!ids.has(id)){delete synced[id];DB.doc('plants/'+id).delete().catch(fail)}});
}
render();
try{window.claude.use('db').then(db=>{
  if(!db)return;
  const local=plants.slice();let migrated=false;
  db.collection('plants').onSnapshot(s=>{
    DB=db;
    const cached=s.metadata&&s.metadata.fromCache;
    if(s.empty&&local.length&&!migrated&&!cached){
      migrated=true;plants=local.map(x=>({ts:Date.now(),...x,photo:(x.photo||'').length<230000?(x.photo||''):''}));synced={};save();
      try{localStorage.removeItem(KEY)}catch(e){}
      render();return;
    }
    plants=s.docs.map(d=>({id:d.id,notes:[],...d.data()})).sort((a,b)=>(b.ts||0)-(a.ts||0));
    synced={};plants.forEach(p=>synced[p.id]=JSON.stringify(p));
    render();
  },()=>{DB=null});
}).catch(()=>{})}catch(e){}
</script>
</body>
</html>
